name: Optional Snyk audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snyk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require explicitly configured credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: test -n "$SNYK_TOKEN" || { echo 'Configure SNYK_TOKEN to run this optional workflow.'; exit 1; }
      - run: npm ci --ignore-scripts
      - name: Snyk dependency gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          npx --yes snyk@1.1300.0 test --severity-threshold=high --json-file-output=reports/snyk.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: snyk-evidence
          path: reports/snyk.json
          retention-days: 14
